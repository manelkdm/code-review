<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title description">
<title id="title">Architecture du prototype de revue de code IA</title>
<desc id="description">GitHub Issue et Pull Request déclenchent les vérifications. Les preuves et le diff alimentent six agents exécutés par Ollama, puis un septième agent synthétise la revue. Les résultats sont publiés dans GitHub pour validation humaine.</desc>
<defs>
  <marker id="tip" markerWidth="9" markerHeight="9" refX="7.2" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#5a7a90"/></marker>
  <marker id="tipL" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M8 0 L0 4.5 L8 9 Z" fill="#5a7a90"/></marker>
  <filter id="softshadow" x="-10%" y="-10%" width="120%" height="135%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#2c4b61" flood-opacity=".09"/></filter>
  <style>
    .t{font-family:'Arial','Helvetica',sans-serif;fill:#19364a}
    .muted{font-family:'Arial','Helvetica',sans-serif;fill:#536b7b}
    .caption{font-family:'Arial','Helvetica',sans-serif;fill:#6b7d89}
    .wire{fill:none;stroke:#5a7a90;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#tip)}
    .biwire{fill:none;stroke:#5a7a90;stroke-width:2.6;stroke-linecap:round;marker-start:url(#tipL);marker-end:url(#tip)}
  </style>
</defs>
<rect width="1600" height="920" rx="22" fill="#f7f9fb"/>
<text x="54" y="62" class="t" font-size="31" font-weight="700">Architecture du prototype</text>
<text x="54" y="94" class="muted" font-size="17">GitHub Issues · Pull Requests · GitHub Actions · sept agents IA · validation humaine</text>

<!-- Left: source records -->
<rect x="54" y="166" width="320" height="98" rx="15" fill="#dcecf7" filter="url(#softshadow)"/>
<text x="77" y="204" class="t" font-size="22" font-weight="700">GitHub Issue</text>
<text x="77" y="235" class="muted" font-size="16">Exigences et critères d'acceptation</text>
<rect x="54" y="295" width="320" height="98" rx="15" fill="#dcecf7" filter="url(#softshadow)"/>
<text x="77" y="333" class="t" font-size="22" font-weight="700">Pull Request GitHub</text>
<text x="77" y="364" class="muted" font-size="16">Diff du code et issue liée</text>

<!-- Left: automated checks -->
<text x="54" y="452" class="caption" font-size="15" font-weight="700" letter-spacing="1.2">CONTRÔLES GITHUB ACTIONS</text>
<rect x="54" y="480" width="320" height="102" rx="15" fill="#dcecf7" filter="url(#softshadow)"/>
<text x="77" y="518" class="t" font-size="21" font-weight="700">PR Evidence Checks</text>
<text x="77" y="546" class="muted" font-size="15">Ruff · pytest · Bandit · Gitleaks</text>
<text x="77" y="568" class="caption" font-size="14">Docker isolé · preuves JSON</text>
<rect x="54" y="618" width="320" height="98" rx="15" fill="#e7edf2" filter="url(#softshadow)"/>
<text x="77" y="656" class="t" font-size="21" font-weight="700">Reviewer Unit Tests</text>
<text x="77" y="685" class="muted" font-size="15">Tests du robot et démonstration</text>
<text x="77" y="704" class="caption" font-size="13">Exécution indépendante</text>

<!-- Center: orchestration -->
<rect x="474" y="166" width="676" height="459" rx="18" fill="#eaf4ee" stroke="#c9dfd1" stroke-width="1.6" filter="url(#softshadow)"/>
<text x="503" y="207" class="t" font-size="24" font-weight="700">AI Code Review · Orchestrateur Python</text>
<text x="503" y="239" class="muted" font-size="16">Six analyses spécialisées · appels séquentiels · résultats structurés</text>

<rect x="503" y="273" width="298" height="93" rx="11" fill="#fff"/>
<text x="522" y="305" class="t" font-size="20" font-weight="700">1 · Exigences</text>
<text x="522" y="333" class="muted" font-size="15">Critères de l'issue GitHub</text>
<rect x="822" y="273" width="298" height="93" rx="11" fill="#fff"/>
<text x="841" y="305" class="t" font-size="20" font-weight="700">2 · Analyse du code</text>
<text x="841" y="333" class="muted" font-size="15">Logique, cohérence et diff</text>

<rect x="503" y="385" width="298" height="93" rx="11" fill="#fff"/>
<text x="522" y="417" class="t" font-size="20" font-weight="700">3 · Qualité</text>
<text x="522" y="445" class="muted" font-size="15">Lisibilité et constats Ruff</text>
<rect x="822" y="385" width="298" height="93" rx="11" fill="#fff"/>
<text x="841" y="417" class="t" font-size="20" font-weight="700">4 · Conformité</text>
<text x="841" y="445" class="muted" font-size="15">Exigences et implémentation</text>

<rect x="503" y="497" width="298" height="93" rx="11" fill="#fff"/>
<text x="522" y="529" class="t" font-size="20" font-weight="700">5 · Tests</text>
<text x="522" y="557" class="muted" font-size="15">Couverture et résultats</text>
<rect x="822" y="497" width="298" height="93" rx="11" fill="#fff"/>
<text x="841" y="529" class="t" font-size="20" font-weight="700">6 · Sécurité</text>
<text x="841" y="557" class="muted" font-size="15">Bandit et Gitleaks</text>

<!-- Right: model -->
<rect x="1262" y="195" width="286" height="131" rx="16" fill="#eee9f9" filter="url(#softshadow)"/>
<text x="1287" y="234" class="t" font-size="23" font-weight="700">Ollama</text>
<text x="1287" y="268" class="t" font-size="19">qwen2.5-coder:7b</text>
<text x="1287" y="298" class="muted" font-size="14">Modèle sur le runner GitHub</text>

<!-- Synthesis -->
<rect x="474" y="665" width="676" height="85" rx="16" fill="#e1dafa" filter="url(#softshadow)"/>
<text x="503" y="703" class="t" font-size="23" font-weight="700">7 · Synthèse et recommandation</text>
<text x="503" y="731" class="muted" font-size="16">Consolidation des six analyses et des contrôles</text>

<!-- Right: outputs -->
<rect x="1262" y="665" width="286" height="112" rx="16" fill="#e6edf2" filter="url(#softshadow)"/>
<text x="1287" y="699" class="t" font-size="22" font-weight="700">Résultats GitHub</text>
<text x="1287" y="728" class="muted" font-size="15">Commentaire sur la PR</text>
<text x="1287" y="754" class="muted" font-size="15">Rapports Markdown et JSON</text>

<!-- Human decision -->
<rect x="54" y="817" width="1494" height="78" rx="17" fill="#183e55"/>
<text x="81" y="850" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#fff" font-weight="700">Validation humaine</text>
<text x="81" y="877" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#d9e8f2">Lire les constats · corriger si nécessaire · approuver ou refuser la Pull Request · fusionner manuellement</text>

<!-- Routes: all stop before nodes, no lines run through text or boxes -->
<!-- Issue and pull request each feed orchestrator -->
<path class="wire" d="M374 214 H465"/>
<path class="wire" d="M374 344 H465"/>
<!-- PR triggers two independent checks: route outside their left edges -->
<path d="M54 364 H28 V666" fill="none" stroke="#5a7a90" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<path class="wire" d="M28 531 H45"/>
<path class="wire" d="M28 666 H45"/>
<!-- Evidence feeds AI review, not unit tests -->
<path class="wire" d="M374 532 H465"/>
<!-- LLM service is shared by all agents -->
<path class="biwire" d="M1159 262 H1253"/>
<!-- Orchestrator into synthesis -->
<path class="wire" d="M812 625 V656"/>
<!-- Synthesis into GitHub report -->
<path class="wire" d="M1150 711 H1253"/>
<!-- Published report to human review -->
<path class="wire" d="M1405 777 V808"/>
</svg>